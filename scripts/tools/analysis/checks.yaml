# NetOps — security checks catalog
# Used by security_assessment.py. To add a check, append an entry.
# type: port   -> detected by an open port (needs a scan)
# type: config -> detected by a regex on the collected configuration (needs --config-file)
# severity: CRITICAL | HIGH | MEDIUM | LOW | INFO
# (Legacy Portuguese keys titulo/severidade/tipo/porta/padrao/descricao/referencia are still read.)

version: 1

checks:
  - id: telnet-exposed
    title: "Telnet exposed"
    severity: HIGH
    type: port
    port: 23
    description: "Telnet sends user and password in clear text. Disable it and use SSH."
    reference: best-practices/general/ssh-hardening.md

  - id: ftp-exposed
    title: "FTP exposed"
    severity: MEDIUM
    type: port
    port: 21
    description: "FTP does not encrypt credentials. Prefer SFTP/SCP."
    reference: best-practices/general/network-security-audit.md

  - id: snmp-exposed
    title: "SNMP exposed"
    severity: MEDIUM
    type: port
    port: 161
    description: "Exposed SNMP can leak the topology. Restrict it with an ACL and use SNMPv3."
    reference: best-practices/general/network-security-audit.md

  - id: http-mgmt-exposed
    title: "HTTP management without TLS"
    severity: MEDIUM
    type: port
    port: 80
    description: "Management interface over plain HTTP. Use HTTPS and restrict access."
    reference: best-practices/general/network-security-audit.md

  - id: routeros-api-no-tls
    title: "RouterOS API without TLS"
    severity: MEDIUM
    type: port
    port: 8728
    description: "The MikroTik API on 8728 has no TLS. Prefer API-SSL on 8729."
    reference: best-practices/mikrotik/security-hardening.md

  - id: rdp-exposed
    title: "RDP exposed"
    severity: HIGH
    type: port
    port: 3389
    description: "Exposed RDP is a common attack target. Restrict it with a VPN/ACL."
    reference: best-practices/general/network-security-audit.md

  - id: snmp-community-public
    title: "Default SNMP community (public/private)"
    severity: HIGH
    type: config
    pattern: '(?i)community[=:\s"]+(public|private)'
    description: "A default SNMP community lets anyone read. Change it to something unique."
    reference: best-practices/general/network-security-audit.md

  - id: telnet-service-enabled
    title: "Telnet service enabled in the config"
    severity: HIGH
    type: config
    pattern: '(?i)\btelnet\b.*(enabled|yes|up)|service telnet'
    description: "The Telnet service appears enabled in the configuration. Disable it."
    reference: best-practices/general/ssh-hardening.md

  - id: weak-snmp-v1v2
    title: "SNMP v1/v2c in use"
    severity: MEDIUM
    type: config
    pattern: '(?i)version\s*[=:]?\s*(1|2c)|v2c'
    description: "SNMP v1/v2c neither authenticates nor encrypts. Migrate to SNMPv3."
    reference: best-practices/general/network-security-audit.md
