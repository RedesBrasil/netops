<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b78c2" />
  <title>NetOps · sem conexão</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f6f9; --text:#1c2530; --muted:#6b7785; --accent:#1b78c2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#11161c; --text:#e6ebf1; --muted:#93a1b1; --accent:#4aa3e0; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
    img { width:96px; height:96px; border-radius:22px; }
    h1 { font-size:20px; margin:16px 0 4px; }
    p { color:var(--muted); margin:0 0 20px; max-width:34ch; }
    button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 18px; font:inherit; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/pwa/icon-192.png" alt="" />
    <h1>Sem conexão com o NetOps</h1>
    <p>O console não respondeu. Pode ser sua rede ou um reinício do servidor (leva ~15 s).</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>
    // Volta sozinho quando o servidor responder de novo.
    setInterval(() => { fetch("/", { cache: "no-store" }).then((r) => { if (r.ok) location.reload(); }).catch(() => {}); }, 5000);
  </script>
</body>
</html>
