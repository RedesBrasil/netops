# NetOps — Multi-IDE integration
# ============================================================================
# NetOps works in any AI IDE. The universal entry point is the AGENTS.md
# at the root — any IDE understands the framework by reading that file (CLAUDE.md was retired).
# Adapted from the ide_sync block of the AIOX framework-config.yaml.
# ============================================================================

ide_integration:
  # Source of truth — the agents and workflows live here; the IDEs only read them.
  source:
    agents: "agents/"
    workflows: "workflows/"
    entrypoint: "AGENTS.md"

  targets:
    claude-code:
      enabled: true
      entrypoint: "AGENTS.md"           # read automatically by Claude Code (AGENTS.md standard)
      commands: ".claude/commands/"     # slash commands /netops-audit, /netops-apply-change
      notes: "Agents read on demand from agents/*.agent.md as AGENTS.md instructs."

    codex:
      enabled: true
      entrypoint: "AGENTS.md"           # read automatically by Codex
      notes: "AGENTS.md at the root is the complete entry point."

    cursor:
      enabled: true
      entrypoint: ".cursor/rules/netops.mdc"
      notes: "Cursor rule that loads the framework and points to AGENTS.md."

    antigravity:
      enabled: true
      entrypoint: "AGENTS.md"
      notes: "Antigravity reads the AGENTS.md at the root."

  # Principle: there is no build or mandatory sync. Opening the folder in the IDE is enough.
  # The .claude/ and .cursor/ files are thin — they only point to the framework core.
