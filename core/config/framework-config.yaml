# NetOps — Integração multi-IDE
# ============================================================================
# O NetOps funciona em qualquer IDE de IA. O ponto de entrada universal é o CLAUDE.md
# (e o AGENTS.md) na raiz — qualquer IDE entende o framework lendo esses arquivos.
# Adaptado do bloco ide_sync do framework-config.yaml do AIOX.
# ============================================================================

ide_integration:
  # Fonte da verdade — os agentes e workflows ficam aqui; as IDEs apenas leem.
  source:
    agents: "agents/"
    workflows: "workflows/"
    entrypoint: "CLAUDE.md"

  targets:
    claude-code:
      enabled: true
      entrypoint: "CLAUDE.md"           # lido automaticamente pelo Claude Code
      commands: ".claude/commands/"     # slash commands /netops-audit, /netops-apply-change
      notes: "Agentes lidos sob demanda de agents/*.agent.md conforme o CLAUDE.md instrui."

    codex:
      enabled: true
      entrypoint: "AGENTS.md"           # lido automaticamente pelo Codex
      notes: "AGENTS.md na raiz aponta para o CLAUDE.md."

    cursor:
      enabled: true
      entrypoint: ".cursor/rules/netops.mdc"
      notes: "Regra do Cursor que carrega o framework e aponta para o CLAUDE.md."

    antigravity:
      enabled: true
      entrypoint: "AGENTS.md"
      notes: "O Antigravity lê o AGENTS.md da raiz."

  # Princípio: não há build nem sincronização obrigatória. Abrir a pasta na IDE basta.
  # Os arquivos .claude/ e .cursor/ são finos — só apontam para o core do framework.
