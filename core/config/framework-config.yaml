# NetOps — Integração multi-IDE
# ============================================================================
# O NetOps funciona em qualquer IDE de IA. O ponto de entrada universal é o AGENTS.md
# na raiz — qualquer IDE entende o framework lendo esse arquivo (CLAUDE.md foi aposentado).
# Adaptado do bloco ide_sync do framework-config.yaml do AIOX.
# ============================================================================

ide_integration:
  # Fonte da verdade — os agentes e workflows ficam aqui; as IDEs apenas leem.
  source:
    agents: "agents/"
    workflows: "workflows/"
    entrypoint: "AGENTS.md"

  targets:
    claude-code:
      enabled: true
      entrypoint: "AGENTS.md"           # lido automaticamente pelo Claude Code (padrão AGENTS.md)
      commands: ".claude/commands/"     # slash commands /netops-audit, /netops-apply-change
      notes: "Agentes lidos sob demanda de agents/*.agent.md conforme o AGENTS.md instrui."

    codex:
      enabled: true
      entrypoint: "AGENTS.md"           # lido automaticamente pelo Codex
      notes: "AGENTS.md na raiz é o ponto de entrada completo."

    cursor:
      enabled: true
      entrypoint: ".cursor/rules/netops.mdc"
      notes: "Regra do Cursor que carrega o framework e aponta para o AGENTS.md."

    antigravity:
      enabled: true
      entrypoint: "AGENTS.md"
      notes: "O Antigravity lê o AGENTS.md da raiz."

  # Princípio: não há build nem sincronização obrigatória. Abrir a pasta na IDE basta.
  # Os arquivos .claude/ e .cursor/ são finos — só apontam para o core do framework.
