# Handoff Template between Agents
# ============================================================================
# Adapted from aiox-core/.aiox-core/development/templates/agent-handoff-tmpl.yaml
# When an agent finishes its step, it fills in this artifact. The next
# agent receives: its own full profile (.agent.md) + this artifact.
# CONSTRAINT: the filled-in artifact MUST be under 500 tokens (~375 words).
# ============================================================================

handoff:
  version: "1.0"
  timestamp: ""            # ISO 8601, e.g.: 2026-05-18T14:30:00Z
  from_agent: ""           # id of the outgoing agent (coordinator|planner|executor|tester|documenter)
  to_agent: ""             # id of the incoming agent

  # Run context
  run_context:
    run_id: ""             # e.g.: 2026-05-18-1430-security-audit
    run_dir: ""            # e.g.: runs/2026-05-18-1430-security-audit/
    workflow: ""           # e.g.: security-audit
    current_step: ""       # e.g.: "03 - collect from the devices"
    target_hosts: []       # hosts involved in this step

  # Key decisions made by the outgoing agent (max. 5)
  decisions:
    - ""

  # Files created/modified by the outgoing agent (max. 10)
  files_modified:
    - ""

  # Open blockers or problems (max. 3)
  blockers:
    - ""

  # What the incoming agent must do now (max. 2 sentences)
  next_action: ""

# --- Compaction limits ---
# Max. size: 500 tokens | Decisions: 5 | Files: 10 | Blockers: 3
# Summaries retained: 3 (the oldest is discarded at the 4th agent switch).
