name: NetOps release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão X.Y.Z já commitada em core-config e CHANGELOG
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: netops-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir versão solicitada e branch
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/engine')
          from update.common import read_version, version_tuple
          requested = os.environ['REQUESTED_VERSION']
          version_tuple(requested)
          assert requested == read_version(Path.cwd()), 'Versão solicitada difere do código'
          PY
      - name: Instalar dependências de testes
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Testar
        run: |
          python -m pytest scripts/engine/ui/tests/ -q
          node --test scripts/engine/ui/tests/api-errors.test.mjs
      - name: Consultar releases atuais e preparar pacote
        run: python scripts/engine/update/release.py --output "$RUNNER_TEMP/netops-release"
      - name: Validar extração e versão do pacote
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/engine')
          from update.engine import unpack
          root = Path(os.environ['RUNNER_TEMP'])
          version = os.environ['REQUESTED_VERSION']
          unpack(root / 'netops-release' / f'netops-{version}.tar.gz', root / 'validated-release', version)
          PY
      - name: Criar draft com changelog e assets
        run: |
          gh release create "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "NetOps v$REQUESTED_VERSION" --draft \
            --notes-file "$RUNNER_TEMP/netops-release/release-notes.md" \
            "$RUNNER_TEMP/netops-release/netops-$REQUESTED_VERSION.tar.gz" \
            "$RUNNER_TEMP/netops-release/SHA256SUMS"
      - name: Conferir digest publicado e publicar release
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          version = os.environ['REQUESTED_VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          name = f'netops-{version}.tar.gz'
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/v{version}']))
          asset = next(a for a in data['assets'] if a['name'] == name)
          digest = hashlib.sha256((Path(os.environ['RUNNER_TEMP']) / 'netops-release' / name).read_bytes()).hexdigest()
          assert asset['digest'] == f'sha256:{digest}', 'Digest do GitHub divergente'
          PY
          gh release edit "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
