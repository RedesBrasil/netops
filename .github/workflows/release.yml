name: NetOps release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão X.Y.Z já commitada em core-config e CHANGELOG
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: netops-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Conferir versão solicitada e branch
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/engine')
          from update.common import read_version, version_tuple
          requested = os.environ['REQUESTED_VERSION']
          version_tuple(requested)
          assert requested == read_version(Path.cwd()), 'Versão solicitada difere do código'
          PY
      - name: Instalar dependências de testes
        run: python -m pip install -r requirements.txt pytest pytest-xdist pytest-timeout
      - name: Testar
        # Paralelo (xdist), teto de 5 min por teste (trava vira falha com traceback, não
        # job de 30 min) e os 10 mais lentos no log para enxergar regressão de tempo.
        run: |
          python -m pytest scripts/engine/ui/tests/ -q -n auto --timeout=300 --durations=10 -p no:warnings
          node --test scripts/engine/ui/tests/*.test.mjs
          node scripts/engine/ui/maps/test-geometry.mjs
          node --test scripts/engine/ui/maps/node-state.test.mjs
      - name: Consultar releases atuais e preparar pacote
        run: python scripts/engine/update/release.py --output "$RUNNER_TEMP/netops-release"
      - name: Validar extração e versão do pacote
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/engine')
          from update.engine import unpack
          root = Path(os.environ['RUNNER_TEMP'])
          version = os.environ['REQUESTED_VERSION']
          unpack(root / 'netops-release' / f'netops-{version}.tar.gz', root / 'validated-release', version)
          PY
      - name: Criar ou retomar draft da mesma revisão
        run: |
          if gh release view "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,targetCommitish,tagName,assets > "$RUNNER_TEMP/existing-release.json"; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'existing-release.json').read_text())
          version = os.environ['REQUESTED_VERSION']
          assert data['isDraft'], 'Nunca substituir uma release publicada'
          assert data['tagName'] == f'v{version}'
          assert data['targetCommitish'] == os.environ['GITHUB_SHA'], 'Draft de outra revisão; investigar antes de retomar'
          allowed = {f'netops-{version}.tar.gz', 'SHA256SUMS'}
          assert all(a['name'] in allowed for a in data['assets']), 'Draft contém assets desconhecidos'
          PY
            gh release edit "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/netops-release/release-notes.md"
            gh release upload "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
              "$RUNNER_TEMP/netops-release/netops-$REQUESTED_VERSION.tar.gz" \
              "$RUNNER_TEMP/netops-release/SHA256SUMS"
          else
            gh release create "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "NetOps v$REQUESTED_VERSION" --draft \
              --notes-file "$RUNNER_TEMP/netops-release/release-notes.md" \
              "$RUNNER_TEMP/netops-release/netops-$REQUESTED_VERSION.tar.gz" \
              "$RUNNER_TEMP/netops-release/SHA256SUMS"
          fi
      - name: Conferir digest publicado e publicar release
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          version = os.environ['REQUESTED_VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          # A API /releases/tags/<tag> não encontra drafts sem tag publicada.
          data = json.loads(subprocess.check_output(['gh', 'release', 'view', f'v{version}', '--repo', repo,
                                                     '--json', 'isDraft,targetCommitish,tagName,assets']))
          assert data['isDraft'] and data['targetCommitish'] == os.environ['GITHUB_SHA']
          assert data['tagName'] == f'v{version}'
          expected = {f'netops-{version}.tar.gz', 'SHA256SUMS'}
          assert len(data['assets']) == len(expected) and {a['name'] for a in data['assets']} == expected
          for asset in data['assets']:
              digest = hashlib.sha256((Path(os.environ['RUNNER_TEMP']) / 'netops-release' / asset['name']).read_bytes()).hexdigest()
              assert asset['digest'] == f'sha256:{digest}', 'Digest do GitHub divergente: ' + asset['name']
          PY
          gh release edit "v$REQUESTED_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
