workflow:
  id: apply-config-change
  name: Apply Configuration Change
  description: >-
    Plans, reviews, applies and verifies a configuration change on one or more
    devices. Always with baseline + rollback (see core/rules/connection-safety.md).
  triggers:
    - "configure OSPF on the MikroTik"
    - "change the configuration of"
    - "*apply-change"

  steps:
    - id: "01"
      name: Understand the change and load context
      type: inline
      agent: coordinator
      inputFiles: [network/hosts.yaml, network/topology.yaml, memory/MEMORY.md]
      outputFiles: ["runs/${run}/state.json"]
      instructions: >-
        Capture the intent, the target hosts and the vendor. Inject relevant memory.
        Confirm the maintenance window in memory/MEMORY.md. Create runs/${run}/.
      qualityCriteria: Target hosts and type of change identified.

    - id: "02"
      name: Capture current state (baseline)
      type: subagent
      agent: executor
      outputFiles: ["runs/${run}/collected/<host>.before.txt"]
      instructions: >-
        Prerequisite: if the credentials are encrypted, the vault must be
        unlocked (the operator runs 'python3 scripts/engine/vault/cli.py unlock'). Read-only connection.
        Capture the current configuration of the area that will be changed — needed for the diff and the rollback.
      vetoConditions: ["Host not in network/hosts.yaml", "Credential vault locked"]

    - id: "03"
      name: Design the proposed config and the rollback
      type: subagent
      agent: planner
      inputFiles: [config-examples/, best-practices/, memory/MEMORY.md]
      outputFiles: ["runs/${run}/proposals/<host>.change.txt", "runs/${run}/proposals/<host>.rollback.txt"]
      instructions: >-
        Reuse the examples in config-examples/<vendor>/ (REUSE > ADAPT > CREATE). Produce the
        apply commands AND the rollback commands. Assess the lockout risk (management/firewall).
      qualityCriteria: There is a change.txt and a rollback.txt for each host; rollback is testable.
      vetoConditions: ["Proposal without a matching rollback"]

    - id: "04"
      name: Technical review
      type: subagent
      agent: tester
      inputFiles: ["runs/${run}/proposals/", config-examples/, best-practices/]
      outputFiles: ["runs/${run}/findings.yaml"]
      instructions: >-
        Validate the syntax against the vendor (config-examples/<vendor>/). Check the impact
        on the topology. Run scripts/tools/analysis/config_diff.py (before x proposal). Verdict
        APPROVED / CAVEATS / REJECTED.
      vetoConditions: ["Invalid syntax for the vendor", "Risk of losing management access without protection"]

    - id: "05"
      name: Apply the change
      type: subagent
      agent: executor
      inputFiles: ["runs/${run}/proposals/<host>.change.txt"]
      outputFiles: ["runs/${run}/collected/<host>.after.txt"]
      instructions: >-
        Apply the config. Capture the post-change state. If any command fails or
        management connectivity drops, run <host>.rollback.txt automatically and stop.
      vetoConditions: ["Tester verdict == REJECTED"]

    - id: "06"
      name: Post-change verification
      type: subagent
      agent: tester
      inputFiles: ["runs/${run}/collected/<host>.before.txt", "runs/${run}/collected/<host>.after.txt"]
      instructions: >-
        Confirm that the change had the expected effect and did not break connectivity
        (scripts/tools/diagnostics/). If it failed: recommend/trigger the rollback.
      qualityCriteria: Effect of the change confirmed; connectivity preserved.

    - id: "07"
      name: Record the change
      type: subagent
      agent: documenter
      inputFiles: [core/templates/change-record.tmpl.md]
      outputFiles: ["reports/${date}-change-<host>.md"]
      instructions: >-
        Generate the change record (before/after, diff, who/when, result).

    - id: "99"
      name: Post-run reflection
      type: subagent
      agent: documenter
      outputFiles: ["memory/MEMORY.md"]
      instructions: >-
        Append the lessons as dated bullets to memory/MEMORY.md, according to
        core/rules/memory-protocol.md. If a vendor quirk was discovered, consider
        promoting it to best-practices/ or config-examples/. Mark state.json as completed.
