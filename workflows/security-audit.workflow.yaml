workflow:
  id: security-audit
  name: Network Security Audit
  description: >-
    Collects the configuration of hosts in the inventory and assesses the security posture against
    best practices. Produces a report prioritized by severity.
  triggers:
    - "run a security assessment of my network"
    - "audit the security"
    - "*security-audit"

  steps:
    - id: "01"
      name: Define scope and load context
      type: inline
      agent: coordinator
      inputFiles: [network/hosts.yaml, network/topology.yaml, memory/MEMORY.md]
      outputFiles: ["runs/${run}/state.json"]
      instructions: >-
        Validate the inventory (python3 scripts/engine/lib/inventory.py --validate). Define the scope
        (all hosts or a subset). Inject the relevant memory according to
        core/rules/memory-protocol.md. Create runs/${run}/ from core/templates/run-state.tmpl.json.
      qualityCriteria: Inventory valid; scope defined; runs/${run}/state.json created.
      vetoConditions: ["Inventory invalid against the schema"]

    - id: "02"
      name: Plan the collection
      type: subagent
      agent: planner
      inputFiles: [best-practices/general/network-security-audit.md, best-practices/_catalog.yaml]
      outputFiles: ["runs/${run}/plan.yaml"]
      instructions: >-
        For each host in scope, list the read-only audit commands per vendor
        (firewall, services, users, snmp, firmware version). Consult best-practices/<vendor>/.
      qualityCriteria: Every host has commands; no write command in the plan.

    - id: "03"
      name: Collect from the devices
      type: subagent
      agent: executor
      inputFiles: ["runs/${run}/plan.yaml", network/credentials.yaml]
      outputFiles: ["runs/${run}/collected/*.txt"]
      instructions: >-
        Prerequisite: if the credentials are encrypted, the vault must be
        unlocked (the operator runs 'python3 scripts/engine/vault/cli.py unlock'). Connect to each host
        with scripts/tools/access/session.py (run --host-id <ID> --command ...; api_mikrotik.py if method=api). Read-only mode. On connection failure:
        record the error and move on to the next host.
      vetoConditions: ["Host not in network/hosts.yaml", "Plan contains a write command", "Credential vault locked"]

    - id: "04"
      name: Assess security
      type: subagent
      agent: tester
      inputFiles: ["runs/${run}/collected/", best-practices/general/network-security-audit.md]
      outputFiles: ["runs/${run}/findings.yaml"]
      instructions: >-
        Run scripts/tools/analysis/security_assessment.py (with --config-file of the collected data).
        Check each finding against best-practices/. Classify by severity
        CRITICAL/HIGH/MEDIUM/LOW, with evidence and reference.
      qualityCriteria: Every host has a verdict; every finding has evidence + reference.

    - id: "05"
      name: Review findings with the user
      type: checkpoint
      agent: coordinator
      instructions: >-
        Present the summary of findings by severity. Options: 1) generate the full
        report; 2) dig deeper into a host; 3) finish.

    - id: "06"
      name: Generate report
      type: subagent
      agent: documenter
      inputFiles: ["runs/${run}/findings.yaml", core/templates/security-report.tmpl.md]
      outputFiles: ["reports/${date}-security-audit.md"]
      instructions: >-
        Generate the report from the template, with an executive summary and prioritized findings.
      qualityCriteria: Report exists in reports/ with summary + detail + recommendations.

    - id: "99"
      name: Post-run reflection
      type: subagent
      agent: documenter
      outputFiles: ["memory/MEMORY.md"]
      instructions: >-
        Append the lessons (connection errors, vendor quirks, discoveries) as dated bullets
        to memory/MEMORY.md according to core/rules/memory-protocol.md. Mark state.json
        as completed.
