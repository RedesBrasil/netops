# Workflow template — copy it when creating a new workflow. See workflows/STANDARD.md.
workflow:
  id: workflow-identifier
  name: Readable Workflow Name
  description: >-
    What this workflow solves, in one or two sentences.
  triggers:
    - "typical user phrase that triggers this workflow"
    - "*explicit-command"

  steps:
    - id: "01"
      name: Name of the first step
      type: inline
      agent: coordinator
      inputFiles: [network/hosts.yaml]
      outputFiles: ["runs/${run}/state.json"]
      instructions: >-
        What the agent must do in this step.
      qualityCriteria: How to know the step went well.
      vetoConditions: []

    - id: "02"
      name: Example step (subagent)
      type: subagent
      agent: planner
      inputFiles: []
      outputFiles: []
      instructions: >-
        ...

    # ... more steps ...

    - id: "99"
      name: Post-run reflection
      type: subagent
      agent: documenter
      instructions: >-
        Append lessons as dated bullets to memory/MEMORY.md according to core/rules/memory-protocol.md.
