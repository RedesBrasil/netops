# Configuration Examples Index
# The agent reads this index to find the right example by vendor + topic.

version: 1

examples:
  # --- MikroTik ---
  - vendor: mikrotik
    topic: security-hardening
    file: mikrotik/security-hardening.rsc
    description: "Hardening of services, users, discovery and SNMP."
  - vendor: mikrotik
    topic: firewall
    file: mikrotik/firewall-baseline.rsc
    description: "Secure input chain (default drop) with anti-brute-force."
  - vendor: mikrotik
    topic: ospf
    file: mikrotik/ospf-basic.rsc
    description: "OSPF instance with backbone area and minimal redistribution."
  - vendor: mikrotik
    topic: vlan
    file: mikrotik/vlan-trunk.rsc
    description: "VLANs over a bridge with a trunk port and access ports."

  # --- Linux ---
  - vendor: linux
    topic: ssh
    file: linux/sshd_config
    description: "Hardened sshd_config — keys, no root, modern ciphers."
  # More Linux examples (host firewall, Apache, Docker) go here as
  # the living project evolves — see config-examples/STANDARD.md and best-practices/linux/.

# Vendor status — seed = filled in | pendente = structure only
vendors:
  mikrotik:  { status: seed }
  linux:     { status: seed }
  cisco:     { status: pendente }
  huawei:    { status: pendente }
  unifi:     { status: pendente }
  ubiquiti:  { status: pendente }
  proxmox:   { status: pendente }
  vmware:    { status: pendente }
  datacom:   { status: pendente }
  fiberhome: { status: pendente }
  intelbras: { status: pendente }
