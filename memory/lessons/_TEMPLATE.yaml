# Modelo de lição — copie ao registrar um aprendizado novo.
# Nome do arquivo: YYYY-MM-DD-<slug-curto>.yaml
# Ver core/rules/memory-protocol.md.

id: slug-curto-da-licao
tipo: connection-quirk        # connection-quirk | vendor-quirk | operational | error
vendor: mikrotik              # fabricante envolvido, ou 'general'
gatilho: "O que aconteceu que disparou o aprendizado."
licao: "O fato aprendido, escrito como afirmação declarativa (não como ordem)."
correcao: "O que fazer para evitar/resolver isto da próxima vez."
ocorrencias: 1                # incrementar quando o padrão se repetir
estado: ativo                 # ativo | stale | archived
data: "2026-05-18"
run_id: ""                    # execução em que foi observado (runs/<id>)
