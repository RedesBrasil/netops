# NetOps — Inventário de hosts (EXEMPLO)
# ============================================================================
# Copie este arquivo para `network/hosts.yaml` e substitua pelos SEUS equipamentos.
# O `hosts.yaml` real é git-ignorado (não vai para o repositório).
#
# Esta é a FONTE DA VERDADE da rede. O agente só conhece equipamentos listados aqui.
# Cada host referencia uma credencial NOMEADA (definida em credentials.yaml).
# Campos definidos num 'group' são herdados; o host pode sobrescrever qualquer um.
# Schema validável em: core/schemas/inventory.schema.json
# ============================================================================

version: 2
next_host_id: 5

# --- Grupos: defaults herdados pelos hosts ---
groups:
  mikrotik-core:
    vendor: mikrotik
    role: core
    access: {method: api, port: 8728}     # API RouterOS (8729 = API-SSL)
    credential: cred_mikrotik_admin

  mikrotik-dist:
    vendor: mikrotik
    role: distribution
    access:
      method: ssh
      port: 22
    credential: cred_mikrotik_admin

  linux-servers:
    vendor: linux
    role: server
    access:
      method: ssh
      port: 22
    credential: cred_linux_root

# --- Hosts (exemplos — substitua pelos seus) ---
hosts:
  - id: 1
    hostname: RT-CORE-01
    mgmt_ip: 10.0.0.1                     # IP de gerência: é por ele que os scripts conectam
    extra_ips:                            # opcional, até 20; só informativo (não usado para conexão)
      - {ip: 198.51.100.10/29, role: público, description: Link principal}
      - {ip: 10.0.1.1, role: interno, description: Gateway da LAN}
    group: mikrotik-core
    site: matriz

  - id: 2
    hostname: RT-DIST-01
    mgmt_ip: 10.0.0.2
    group: mikrotik-dist
    site: matriz

  - id: 4
    hostname: SW-ACCESS-01
    mgmt_ip: 10.0.0.3
    vendor: cisco
    role: access
    access:
      method: ssh
      port: 22
    credential: cred_cisco_admin
    site: matriz

  - id: 3
    hostname: SRV-WEB-01
    mgmt_ip: 10.0.20.10
    group: linux-servers
    site: matriz
    notes: Servidor web de exemplo

# Compatibilidade de nomes anteriores; a identidade canônica é o inteiro acima.
legacy_aliases:
  - {alias: rt-core-01, host_id: 1}
  - {alias: rt-dist-01, host_id: 2}
  - {alias: srv-web-01, host_id: 3}
  - {alias: sw-access-01, host_id: 4}
