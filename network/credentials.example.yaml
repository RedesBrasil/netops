# NetOps — Modelo de credenciais
# ============================================================================
# COPIE este arquivo para 'credentials.yaml' e preencha com as credenciais reais.
#   cp network/credentials.example.yaml network/credentials.yaml
#
# 'credentials.yaml' é GIT-IGNORADO (ver .gitignore) — NUNCA é versionado.
#
# CRIPTOGRAFIA (recomendado): proteja as senhas com uma senha-mestra.
#   python scripts/vault/cli.py init       # define a senha-mestra
#   python scripts/vault/cli.py encrypt     # password/secret -> "enc.v1:..."
#   python scripts/vault/cli.py unlock      # destranca a sessão (no início do trabalho)
# Os valores ficam como "enc.v1:<token>" e são descriptografados SÓ em memória, durante
# a sessão. A descriptografia é feita só no resolvedor scripts/lib/inventory.py:resolve_secret()
# — os hosts (hosts.yaml) nunca mudam. Ver scripts/vault/SKILL.md.
#
# Os hosts em hosts.yaml apontam para estas credenciais pelo NOME (ex.: cred_mikrotik_admin).
# ============================================================================

version: 1

credentials:
  cred_mikrotik_admin:
    username: admin
    password: "TROCAR-senha-mikrotik"     # após 'encrypt' vira: password: "enc.v1:gAAAAA..."
    # api_ssl: false        # opcional — true usa porta 8729

  cred_cisco_ro:
    username: netops_ro
    password: "TROCAR-senha-readonly"
    secret: "TROCAR-enable-secret"   # senha de 'enable' (Cisco)

  cred_linux_root:
    username: root
    password: "TROCAR-senha-linux"
    # key_file: ~/.ssh/id_ed25519   # opcional — preferir chave a senha em Linux
